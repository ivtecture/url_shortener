# Три сервиса на Alpine. Наружу опубликован только nginx :80;
# app и redis — во внутренней сети.
#
# Новое для ветки temp-links (временные ссылки):
#   DEFAULT_TTL_SECONDS      — срок жизни ссылки по умолчанию (1 час)
#   MAX_TTL_SECONDS          — потолок TTL (7 дней)
#   CLEANUP_INTERVAL_SECONDS — период фоновой чистки просроченных (5 минут)

services:
  app:
    build: .
    container_name: vremyanka-app
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/urlshortener.db
      REDIS_URL: redis://redis:6379/0
      GEO_API_URL: http://ip-api.com/json/{ip}?fields=status,countryCode
      CACHE_TTL_SECONDS: "3600"
      GEO_CACHE_TTL_SECONDS: "86400"
      GEO_TIMEOUT_SECONDS: "2"
      BASE_URL: http://localhost
      DEFAULT_TTL_SECONDS: "3600"
      MIN_TTL_SECONDS: "60"
      MAX_TTL_SECONDS: "604800"
      CLEANUP_INTERVAL_SECONDS: "300"
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: BusyBox-wget резолвит localhost в ::1,
      # а uvicorn слушает только IPv4 (0.0.0.0) — было connection refused
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: vremyanka-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build: ./nginx
    container_name: vremyanka-nginx
    restart: unless-stopped
    ports:
      - "80:80"                                 # единственный вход снаружи
    volumes:
      - ./static:/usr/share/nginx/html:ro       # статику раздаёт сам nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:                                  # файл БД переживает пересборку
  redis-data:                                   # AOF-персистентность кэша (тёплый старт)
