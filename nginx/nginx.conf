# nginx 1.27-alpine: единая точка входа.
# Статику (/css, /js, /) отдаём с диска; /api/v1/* и короткие ссылки /{code}
# проксируем на FastAPI. Просроченные ссылки приложение отвечает 410 Gone.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Статика фронтенда
        location /css/ {
            expires 7d;
            add_header Cache-Control "public";
        }
        location /js/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # API
        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Короткие ссылки: ровно 7 символов base62 после слэша
        location ~ "^/[0-9a-zA-Z]{7}$" {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Всё остальное — фронтенд (GET /)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
