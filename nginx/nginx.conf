# nginx — единственная точка входа (docs/ARCHITECTURE.md, раздел 7.2):
#   * /static, /css, /js, index.html — с диска, без участия Python;
#   * /api/v1/* — проксирование на FastAPI;
#   * короткие ссылки ^/[0-9a-zA-Z]{7}$ — проксирование на FastAPI.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Сжатие статики и JSON-ответов API
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream app_backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Короткие ссылки: ровно 7 символов base62 -------------------
        # regex-локация выигрывает у префиксной «/», поэтому реальная
        # статика (/css/style.css, /js/app.js) сюда не попадает.
        location ~ "^/[0-9a-zA-Z]{7}$" {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- REST API ----------------------------------------------------
        location /api/v1/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Статика фронтенда --------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
