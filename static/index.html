<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShortURL — простой сокращатель ссылок.">
    <title>ShortURL</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">

    <header class="header">
        <span class="brand">Short<span class="brand-accent">URL</span></span>
    </header>

    <main class="hero">
        <h1 class="hero-title">Короткая ссылка за секунду</h1>
        <p class="hero-sub">Вставьте длинный URL и получите короткий.</p>

        <div class="card">
            <form id="shorten-form" autocomplete="off" novalidate>
                <div class="field">
                    <input
                        type="text"
                        id="url-input"
                        name="original_url"
                        placeholder="https://example.com/very/long/url"
                        spellcheck="false"
                        aria-label="Длинный URL"
                    >
                    <button type="submit" class="btn" id="shorten-btn">Сократить</button>
                </div>
                <p class="hint">только http:// и https://</p>
            </form>

            <div id="error-box" class="error hidden" role="alert"></div>

            <div id="result" class="result hidden" aria-live="polite">
                <div class="result-line">
                    <a id="short-link" class="short-link" href="#" target="_blank" rel="noopener"></a>
                    <button type="button" class="btn btn-ghost" id="copy-btn">Копировать</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>&copy; 2026 ShortURL</span>
    </footer>

</div>

<script src="/js/app.js"></script>
</body>
</html>
